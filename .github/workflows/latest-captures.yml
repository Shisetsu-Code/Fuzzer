name: Latest Fuzzer captures
on:
  workflow_call:
    inputs:
      source_run_id:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      source_run_id:
        description: 'Finished live DEMO or exit-probe run to publish'
        required: true
        type: string
  pull_request:
    paths:
      - '.github/workflows/latest-captures.yml'
      - 'scripts/ci/latest-gallery.mjs'
permissions:
  contents: write
  actions: read
concurrency:
  group: fuzzer-latest-gallery
  cancel-in-progress: false
  queue: max
jobs:
  gallery:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
      - id: source
        name: Validate the explicitly selected owned run
        env:
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import {execFileSync} from 'node:child_process';
          const env=process.env;
          const marker=execFileSync('git',['log','-1','--pretty=%B'],{encoding:'utf8'}).match(/\[gallery-run:([1-9][0-9]{0,19})\]/)?.[1];
          const id=env.SOURCE_RUN_ID||marker;
          if(!id){fs.appendFileSync(env.GITHUB_OUTPUT,'enabled=false\n');process.exit(0);}
          if(!/^[1-9][0-9]{0,19}$/.test(id))throw Error('INVALID_GALLERY_RUN');
          const response=await fetch(`https://api.github.com/repos/${env.GITHUB_REPOSITORY}/actions/runs/${id}`,{headers:{Authorization:`Bearer ${env.GH_TOKEN}`,Accept:'application/vnd.github+json'}});
          if(!response.ok)throw Error('GALLERY_RUN_UNAVAILABLE');
          const run=await response.json();
          if(run.head_repository?.full_name!==env.GITHUB_REPOSITORY||!['codex/explorer-reliability','main'].includes(run.head_branch)||!['.github/workflows/pragmatic-new5.yml','.github/workflows/exit-probe-live.yml'].includes(run.path))throw Error('GALLERY_RUN_NOT_OWNED');
          if(id!==env.GITHUB_RUN_ID&&run.status!=='completed')throw Error('GALLERY_SOURCE_NOT_FINISHED');
          if(!/^[a-f0-9]{40}$/.test(run.head_sha)||!Number.isSafeInteger(run.run_attempt)||run.run_attempt<1)throw Error('GALLERY_INVALID_SOURCE');
          fs.appendFileSync(env.GITHUB_OUTPUT,`enabled=true\nrun_id=${id}\nsource_sha=${run.head_sha}\nattempt=${run.run_attempt}\n`);
          NODE
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        if: steps.source.outputs.enabled == 'true'
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.source.outputs.run_id }}
          path: outputs/gallery-input
      - name: Publish one parentless snapshot of sanitized images
        if: steps.source.outputs.enabled == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          FUZZER_GALLERY_INPUT: outputs/gallery-input
          FUZZER_GALLERY_OUTPUT: outputs/latest-gallery
          FUZZER_GALLERY_RUN_ID: ${{ steps.source.outputs.run_id }}
          FUZZER_GALLERY_ATTEMPT: ${{ steps.source.outputs.attempt }}
          FUZZER_GALLERY_SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
          FUZZER_GALLERY_PUBLISH: '1'
        run: node scripts/ci/latest-gallery.mjs
      - name: Link the gallery
        if: steps.source.outputs.enabled == 'true' && success()
        run: |
          printf '## Capturas de la última corrida\n\n[Ver galería](https://github.com/%s/tree/fuzzer-latest-run)\n' "$GITHUB_REPOSITORY" >> "$GITHUB_STEP_SUMMARY"
