name: Pragmatic CI startup check

on:
  pull_request:
    paths:
      - '.github/workflows/pragmatic-startup.yml'
      - 'scripts/ci/run-live-demo.mjs'
      - 'scripts/ci/hardfire-host.mjs'
      - 'scripts/ci/probe-hardfire-host.mjs'

permissions:
  contents: read

jobs:
  startup:
    name: Electron entry point / no game
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - run: npm install --no-save --package-lock=false --no-audit --no-fund electron@44.4.0
      - name: Verify CLI argument layout without opening a game
        run: |
          mkdir -p outputs
          cat > outputs/electron-entry-probe.mjs <<'NODE'
          import {app} from 'electron';
          import path from 'node:path';
          import {fileURLToPath} from 'node:url';
          import {isRunnerEntry} from '../scripts/ci/run-live-demo.mjs';
          const entry = fileURLToPath(import.meta.url);
          const legacyGuardMatches = Boolean(process.argv[1] && path.resolve(process.argv[1]) === entry);
          const guardMatches = isRunnerEntry(process.argv, import.meta.url);
          console.log('ELECTRON_ENTRY_PROBE=' + JSON.stringify({argv:process.argv,legacyGuardMatches,guardMatches,electron:process.versions.electron,defaultApp:process.defaultApp}));
          app.exit(guardMatches ? 0 : 1);
          NODE
          xvfb-run -a -s '-screen 0 1280x800x24' ./node_modules/.bin/electron --no-sandbox --use-gl=angle --use-angle=swiftshader outputs/electron-entry-probe.mjs

  host-order:
    name: HardFire blank host / ${{ matrix.order }} / no game
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 4
    strategy:
      fail-fast: false
      matrix:
        order: [current, blank-first]
    env:
      HARDFIRE_ROOT: ${{ github.workspace }}/hardfire
      HARDFIRE_PROBE_ORDER: ${{ matrix.order }}
      HARDFIRE_PROBE_OUTPUT_DIR: ${{ github.workspace }}/outputs/hardfire-host-probe/${{ matrix.order }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Checkout the pinned HardFire implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Shisetsu-Code/HardFire
          ref: adf6de5ec14e394f77fb1816d5f46e5deb250b0a
          path: hardfire
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - run: npm install --no-save --package-lock=false --no-audit --no-fund electron@44.4.0
      - name: Compare real host startup order without opening a game
        run: timeout --signal=TERM --kill-after=5s 60s xvfb-run -a -s '-screen 0 1280x800x24' ./node_modules/.bin/electron --no-sandbox --use-gl=angle --use-angle=swiftshader scripts/ci/probe-hardfire-host.mjs
      - name: Preserve blank-host milestones even if native cleanup crashes
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hardfire-host-probe-${{ matrix.order }}-${{ github.run_id }}
          path: |
            outputs/hardfire-host-probe/${{ matrix.order }}/milestones.jsonl
            outputs/hardfire-host-probe/${{ matrix.order }}/result.json
            outputs/hardfire-host-probe/${{ matrix.order }}/blank.jpg
            outputs/hardfire-host-probe/${{ matrix.order }}/HARs/*.har
          if-no-files-found: warn
          retention-days: 7
