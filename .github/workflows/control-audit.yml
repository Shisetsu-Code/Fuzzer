name: Targeted control inventory
on:
  pull_request:
    paths: ['scripts/ci/**', '.github/workflows/control-audit.yml']
permissions:
  contents: read
concurrency:
  group: pragmatic-live-demos
  cancel-in-progress: false
jobs:
  inspect:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HARDFIRE_ROOT: ${{ github.workspace }}/hardfire
      FUZZER_GAME_ID: hundreds-and-thousands
      FUZZER_ARTIFACT_DIR: ${{ github.workspace }}/outputs/audit-private
      FUZZER_OUTPUT_DIR: ${{ github.workspace }}/outputs/audit-public
      FUZZER_MAX_ACTIONS: '2'
      FUZZER_MAX_DEPTH: '8'
      FUZZER_TIMEOUT_MS: '90000'
      FUZZER_SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - id: gate
        run: |
          if git log -1 --pretty=%B | grep -q '\[control-audit\]'; then echo 'enabled=true' >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        if: steps.gate.outputs.enabled == 'true'
        with:
          repository: Shisetsu-Code/HardFire
          ref: adf6de5ec14e394f77fb1816d5f46e5deb250b0a
          path: hardfire
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        if: steps.gate.outputs.enabled == 'true'
        with:
          node-version: '24'
      - if: steps.gate.outputs.enabled == 'true'
        run: npm install --no-save --package-lock=false --no-audit --no-fund electron@44.4.0
      - if: steps.gate.outputs.enabled == 'true'
        run: xvfb-run -a -s '-screen 0 1280x800x24' ./node_modules/.bin/electron --no-sandbox --use-gl=angle --use-angle=swiftshader scripts/ci/run-control-audit.mjs
      - if: always() && steps.gate.outputs.enabled == 'true'
        run: node scripts/ci/recover-live-evidence.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && steps.gate.outputs.enabled == 'true'
        with:
          name: control-audit-${{ github.run_id }}
          path: outputs/audit-public/
          retention-days: 1
