name: Pragmatic multi-game worker benchmark
on:
  push:
    branches:
      - feat/batch-purchase-600-20261017
    paths:
      - scripts/benchmark-pragmatic-worker.mjs
      - .github/workflows/pragmatic-worker-benchmark.yml
  workflow_dispatch:
    inputs:
      game_urls:
        description: "JSON array of 2 to 30 official DEMO URLs; blank uses the four regression games"
        type: string
        required: false
        default: ""
      parallel:
        description: "Concurrent isolated contexts (1 or 2)"
        type: choice
        options: ["1", "2"]
        required: false
        default: "2"
permissions:
  contents: read
concurrency:
  group: pragmatic-benchmark-single-worker
  cancel-in-progress: true
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    env:
      PARALLEL: ${{ inputs.parallel || '2' }}
      GAME_URLS: ${{ inputs.game_urls || '' }}
      GAME_TIMEOUT_MS: "85000"
      BENCHMARK_OUTPUT: outputs/github-playwright-benchmark
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Playwright library once
        run: npm install --no-save --ignore-scripts playwright@1.56.1
      - name: Install Chromium once
        run: npx playwright install --with-deps chromium
      - name: Benchmark DEMOs in one Chromium process
        id: bench
        run: node scripts/benchmark-pragmatic-worker.mjs
      - name: Write benchmark summary
        if: always()
        run: |
          if [ -f outputs/github-playwright-benchmark/summary.json ]; then
            echo '## Real Pragmatic DEMO smoke benchmark' >> "$GITHUB_STEP_SUMMARY"
            echo 'One Chromium process, isolated game contexts, purchases ONLY from previously reviewed fixture plan.' >> "$GITHUB_STEP_SUMMARY"
            echo '~~~json' >> "$GITHUB_STEP_SUMMARY"
            cat outputs/github-playwright-benchmark/summary.json >> "$GITHUB_STEP_SUMMARY"
            echo '~~~' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No benchmark summary generated: inspect setup or script failure." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload per-game screenshots and timings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pragmatic-multi-game-benchmark
          path: outputs/github-playwright-benchmark
          retention-days: 7
          if-no-files-found: warn
